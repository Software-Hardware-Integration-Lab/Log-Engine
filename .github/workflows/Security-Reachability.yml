# Display Name of the workflow
name: Static Analysis - CVE Reachability Scan

# When this workflow triggers
on:
  # Run by hand
  workflow_dispatch: # Run on PR

  # Run when PR is raised to protected branches
  pull_request:
    branches: [main]

  # Run on a schedule (weekly) to ensure scan with latest definitions
  schedule:
    - cron: '59 23 * * 0' # Weekly on Sundays at midnight

# Only allow one scan to run at a time
concurrency:
  group: socket-scan-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

# Define each session of execution that should be executed
jobs:
  socket-security:
    # Display name of the job
    name: Compute Tier-1 Reachability

    # Configures the filter for which operating system that should be used when selecting runners
    runs-on: ubuntu-latest

    # Sets the scopes available to the github_token injected to the GH Actions runner
    permissions:
      issues: read
      contents: read
      pull-requests: read

    # Set of commands to run to compute the reachability of CVEs in the codebase
    steps:
      # Downloads the repo at the specified depth calculated previously
      - name: Clone Repo
        uses: actions/checkout@v7
        background: true
        with:
          # For PRs, fetch one additional commit for proper diff analysis
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}

      # Set up NodeJS on the build host with caching support to optimize execution
      - name: Set up Node.js
        uses: actions/setup-node@v6
        background: true
        with:
          node-version: 24

      # Set up Python runtime on the build host
      - name: Set up Python
        uses: actions/setup-python@v6
        background: true
        with:
          python-version: '3.14'

      # Set up the socket firewall binary
      - name: Install - Socket Firewall
        uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f
        background: true
        with:
          mode: firewall-free

      # Bring job back to sync execution by awaiting for all async jobs to finish before continuing
      - name: Steps - Convert Back To Synchronous Execution - Environment Setup
        wait-all: true

      # Update the NPM CLI to the latest available version
      - name: Update NPM CLI
        background: true
        run: sfw npm install -g npm

      # Install the Socket CLI tool using pip and ensure it's up to date.
      # socketsecurity is pinned rather than left on --upgrade because brand-new releases can
      # pull in an equally brand-new @coana-tech/cli version that is still within Socket's own
      # package-age cooldown window, causing npm ETARGET failures until it ages out. Bump this
      # pin manually once a release is confirmed to work.
      #
      # To check whether a newer socketsecurity release is safe to bump to:
      #   1. Check the candidate version's publish date: https://pypi.org/project/socketsecurity/#history
      #      (or `pip index versions socketsecurity`). It should be at least ~24-48h old so any
      #      npm dependency it pulls in has had time to clear Socket's package-age cooldown.
      #   2. Run `pip download --no-deps socketsecurity==<version> -d /tmp/check && tar tzf /tmp/check/*.tar.gz`
      #      (or inspect the sdist/wheel metadata) to find the @coana-tech/cli version it requires,
      #      then confirm that version's publish date on https://www.npmjs.com/package/@coana-tech/cli
      #      is also old enough (again, at least ~24-48h before the date you plan to run CI).
      #   3. If both dates check out, bump the pin below and watch the next scan run succeed.
      #   4. If the workflow starts failing with the same ETARGET/notarget error again, it means a
      #      new socketsecurity release again pulled in a too-fresh @coana-tech/cli - re-pin to the
      #      last known-good version and retry later.
      - name: Install Socket CLI
        background: true
        run: sfw pip install socketsecurity==2.5.5 uv --upgrade

      # Bring job back to sync execution by awaiting for all async jobs to finish before continuing
      - name: Steps - Convert Back To Synchronous Execution - Packages Updates/Setup
        wait-all: true

      # Run the reachability scan
      - name: Run Socket Security Scan
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_REACHABILITY }}
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: socketcli --target-path $GITHUB_WORKSPACE --scm github --reach
