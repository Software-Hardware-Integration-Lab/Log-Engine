name: Setup CI Caches
description: Restores npm's package download for the current job.
runs:
  using: composite
  steps:
    - name: Restore npm Package Cache
      uses: actions/cache@v5
      with:
        path: ~/.npm
        key: ${{ runner.os }}-npm-v1-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-npm-v1-

